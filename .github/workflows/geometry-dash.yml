name: Refresh linked YouTube videos
on:
  schedule:
    - cron: '43 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-public-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch verified channel videos
        run: node --experimental-strip-types scripts/sync-geometry-dash.mjs
      - run: node --test scripts/*.test.mjs
      - run: npm run check
      - name: Save updated video snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/external/geometry-dash.json data/external/osu-side-channel.json data/external/iyune-channel.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh linked YouTube channel videos'
          gh auth setup-git
          git push
