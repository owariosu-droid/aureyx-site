name: Refresh public content
on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-public-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/youtube-feed.test.mjs
      - run: python scripts/sync-external.py
      - run: npm run check
      - name: Commit refreshed snapshots and artwork
        run: |
          git add data/external public/external
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Bandcamp catalog and osu profile'
          git push
